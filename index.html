<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Systems Architect // Portfolio</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>

    <!-- CSS Structural Vector Grid Layer -->
    <div class="vector-grid-overlay"></div>

    <!-- Main Viewport Interface Box -->
    <div class="app-viewport">

      <!-- Navigation Header Block -->
      <header class="app-header">
        <div class="brand-signature">
          <span class="system-id">SYS_ARCHITECT // TRON_CORE</span>
          <span class="status-indicator">SYSTEM_ACTIVE</span>
        </div>

        <nav class="app-nav">
          <button class="nav-link active" data-tab="profile" onclick="switchTab(this)">PROFILE</button>
          <button class="nav-link" data-tab="projects" onclick="switchTab(this)">ENGAGEMENTS</button>
          <button class="nav-link" data-tab="contact" onclick="switchTab(this)">UPLINK</button>
        </nav>
      </header>

      <!-- Main Display Deck Area -->
      <main class="display-deck">
        <!-- Dynamic Modular Workspace Target -->
        <div id="deck-content" class="content-wrapper">
          <!-- JavaScript will instantly inject content here -->
        </div>
      </main>
    </div>

    <script src="engine.js"></script>
  </body>

</html>
