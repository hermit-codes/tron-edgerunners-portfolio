<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Systems Architect // Establish Uplink</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>

    <div class="vector-grid-overlay"></div>

    <div class="app-viewport">
      <header class="app-header">
        <div class="brand-signature">
          <span class="system-id">SYS_ARCHITECT // TRON_CORE</span>
          <span class="status-indicator">SYSTEM_ACTIVE</span>
        </div>

        <nav aria-label="Main Portfolio Navigation" class="nav-container">
          <!-- 1. The invisible checkbox that holds our open/closed state -->
          <input type="checkbox" id="menu-toggle" class="menu-checkbox">

          <!-- 2. The visible button label for mobile users -->
          <label for="menu-toggle" class="menu-button" aria-hidden="true">
            <span class="burger-line"></span>
            <span class="burger-line"></span>
            <span class="burger-line"></span>
          </label>

          <!-- 3. The actual navigation list -->
          <ul class="app-nav">
            <li><a href="index.html" class="nav-link active">PROFILE</a></li>
            <li><a href="engagements.html" class="nav-link">ENGAGEMENTS</a></li>
            <li><a href="uplink.html" class="nav-link">UPLINK</a></li>
          </ul>
        </nav>
      </header>

      <main class="display-deck">
        <h1 class="content-title">ESTABLISH_UPLINK</h1>
        <p class="summary-text">Secure communications panel. Input your communications metadata to clear direct data
          routing paths.</p>

        <!-- Accessible Semantic HTML Form Element -->
        <form action="#" method="POST">
          <div class="form-group">
            <label for="user-email" class="form-label">CORP_EMAIL_ADDRESS:</label>
            <input type="email" id="user-email" name="email" class="tron-field" required
              placeholder="name@domain.com" />
          </div>

          <div class="form-group">
            <label for="user-message" class="form-label">MESSAGE_PAYLOAD_CONTENT:</label>
            <textarea id="user-message" name="message" class="tron-field" rows="5" required
              placeholder="Type transmission content here..."></textarea>
          </div>

          <button type="submit" class="tron-btn">[ INITIATE_TRANSMISSION ]</button>
        </form>
      </main>
    </div>

  </body>

</html>
